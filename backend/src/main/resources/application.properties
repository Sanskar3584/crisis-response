# Human-readable name for the app (shows up in logs).
spring.application.name=crisis-response-backend

# The port the embedded server listens on. 8080 is the Spring default;
# we set it explicitly so it's obvious and easy to change later.
server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/crisis?replicaSet=rs0
# Secret used to sign JWTs. Provide the real value via the JWT_SECRET
# environment variable in each deployment. Must be at least 32 characters
# (256 bits) for HS256. The fallback below is for local development ONLY.
jwt.secret=${JWT_SECRET:local-dev-only-change-me-0123456789abcdef}
jwt.expiration-ms=28800000
spring.data.mongodb.auto-index-creation=true