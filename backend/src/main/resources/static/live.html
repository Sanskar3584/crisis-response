<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Incident Board</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body style="font-family: sans-serif">
<h1>Live Incident Board</h1>
<p>Paste a staff, manager or admin token (the "token" returned by POST /auth/login) to watch that user's venue.</p>
<input id="token" size="60" placeholder="JWT">
<button id="connect">Connect</button>
<p id="status">Not connected</p>
<ul id="list"></ul>

<script>
    document.getElementById('connect').onclick = () => {
        const status = document.getElementById('status');
        const token = document.getElementById('token').value.trim();
        let venueId;
        try {
            venueId = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).venueId;
        } catch (e) {
            status.textContent = 'That does not look like a JWT';
            return;
        }

        const client = new StompJs.Client({
            webSocketFactory: () => new SockJS('http://localhost:8080/ws'),
            connectHeaders: { Authorization: 'Bearer ' + token },
            onConnect: () => {
                status.textContent = 'Connected to ' + venueId + ' - waiting for incidents';
                client.subscribe('/topic/venue/' + venueId, (msg) => {
                    const i = JSON.parse(msg.body);
                    const li = document.createElement('li');
                    li.textContent = `[${i.severity}] ${i.type} - ${i.status} - ${i.description}`;
                    document.getElementById('list').prepend(li);
                });
            },
            onStompError: (frame) => {
                status.textContent = 'Rejected by the server: ' + frame.headers.message;
                client.deactivate();
            }
        });
        client.activate();
    };
</script>
</body>
</html>
